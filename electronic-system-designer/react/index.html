<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Electronic System Designer | JointJS React</title>
    <meta
      name="description"
      content="An electronic system designer for a 24 V industrial sensor gateway: architecture and pin-level connectivity views, electrical validation with one-click fixes, net tracing, live operating overlays, and BOM/netlist/wire-list outputs. Built with @joint/react-plus (JointJS)."
    />
    <meta
      name="keywords"
      content="electronic design, schematic capture, system designer, block diagram, netlist, BOM, wire list, pinout, ERC, validation, net tracing, EDA, hardware design, JointJS, @joint/react-plus, diagramming"
    />
    <meta name="author" content="JointJS" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://www.jointjs.com/" />

    <!-- Theme color — ink-navy dark canvas (.dark --background) / cool paper light. -->
    <meta name="theme-color" content="#151924" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9fafb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151924" />
    <meta name="color-scheme" content="dark light" />

    <!-- Apply the OS colour scheme before first paint. Without this a theme hook
         adds `.dark` in an effect (post-paint) → a flash of the light theme. -->
    <script>
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}
    </script>

    <!-- First-paint skeleton: a static header bar + canvas surface that paints on
         HTML parse (before the JS bundle runs), so FCP/Speed-Index don't wait for
         the app to boot. Matches the app's real header height + theme background so
         React swapping it out causes no layout shift. Removed when #root renders. -->
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; background: #f9fafb; }
      html.dark #boot { background: #151924; }
      #boot-bar { height: 48px; flex: none; border-bottom: 1px solid #e2e5ea; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
      html.dark #boot-bar { border-color: #2b303d; }
      #boot-logo { width: 22px; height: 22px; background: #ed2637; clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px); }
      #boot-title { width: 128px; height: 12px; border-radius: 4px; background: #d6dae1; }
      html.dark #boot-title { background: #2f3542; }
      #boot-canvas { flex: 1; }
    </style>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JointJS React" />
    <meta property="og:title" content="Electronic System Designer · JointJS+ React" />
    <meta
      property="og:description"
      content="Design a 24 V industrial sensor gateway: architecture blocks, pin-level schematic, electrical validation with one-click fixes, net tracing, live overlays, and BOM/netlist outputs. Built with @joint/react-plus (JointJS)."
    />
    <meta property="og:url" content="https://www.jointjs.com/" />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:image:alt" content="JointJS Electronic System Designer — an EDA-style design tool built with JointJS" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Electronic System Designer · JointJS+ React" />
    <meta
      name="twitter:description"
      content="Architecture + pin-level schematic views, electrical validation with one-click fixes, net tracing, live overlays, and generated engineering outputs. Built with @joint/react-plus (JointJS)."
    />
    <meta name="twitter:image" content="/favicon.svg" />
    <meta name="twitter:image:alt" content="JointJS Electronic System Designer — an EDA-style design tool built with JointJS" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "JointJS Electronic System Designer",
        "description": "An electronic system designer for a 24 V industrial sensor gateway: architecture and pin-level connectivity views, electrical validation with one-click fixes, net tracing, live operating overlays, and BOM/netlist/wire-list outputs. Built with @joint/react-plus (JointJS).",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://www.jointjs.com/",
        "image": "/favicon.svg",
        "author": {
          "@type": "Organization",
          "name": "JointJS",
          "url": "https://www.jointjs.com/"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot" aria-hidden="true">
        <div id="boot-bar">
          <div id="boot-logo"></div>
          <div id="boot-title"></div>
        </div>
        <div id="boot-canvas"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
