name: Deploy demos to GitHub Pages

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Every demo runs its own `npm install`, so without this the runner
      # downloads the same tarballs again on every run. Keyed on the manifests,
      # with a prefix fallback so that touching one demo's dependencies reuses
      # the cache rather than throwing all of it away.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Build demos
        run: bash .github/scripts/build-demos.sh
        env:
          JOINTJS_NPM_TOKEN: ${{ secrets.JOINTJS_NPM_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
