# Builds the demos and reports which ones failed.
#
# Runs on a push to main, by hand, and on `workflow_call` from another
# repository. The only thing that differs between callers is
# `packages_artifact`:
#
#   - empty, and every demo installs the @joint/* versions it pins;
#   - set, and the tarballs in that artifact take their place, so the demos are
#     built against @joint/* packages the caller built itself.
#
# It lives here rather than in a caller because which demos exist, which variant
# of each is canonical and which are skipped is knowledge that belongs next to
# the demos. A caller only has to produce tarballs.
#
# WHICH COMMIT OF THE DEMOS GETS BUILT
#
#   - no `demos_ref`, and the commit under test, which is what our own runs
#     want;
#   - a `demos_ref` that exists here, and that ref;
#   - a `demos_ref` that does not, and the default branch.
#
# Asking for a ref that does not exist is therefore not an error, just a
# fallback. That is deliberate: it lets a caller request some branch
# unconditionally, and get the default whenever that branch is absent, without
# either side having to track whether it exists. The last case resolves the
# default branch rather than reusing the commit this workflow file came from,
# so that a caller pinning `uses:` to a commit - to control which version of
# this workflow runs - does not thereby freeze which demos get built. The run
# summary records which ref was used and why.
#
# NOTE: there is deliberately no `pull_request` trigger. Building a demo runs
# `npm install --ignore-scripts=false` and then its build script, both of which
# execute code from the commit under test - and this job needs
# JOINTJS_NPM_TOKEN, the credential for the private registry. A pull request
# from a branch of this repository *does* receive repository secrets, so a
# `pull_request` trigger would hand that token to unreviewed code and let it be
# read out. Every trigger below is one where the code has already been reviewed
# and merged, or is started by hand by someone who can push. Demo breakage is
# therefore caught just after merge rather than before it; that is the trade
# being made, and it is the same trust model `deploy.yml` already relies on.
name: Build demos

on:
  workflow_call:
    inputs:
      packages_artifact:
        description: 'Artifact holding @joint/* tarballs to build against. Empty means use the packages the demos pin.'
        type: string
        required: false
        default: ''
      plus_only:
        description: 'Build only the demos that depend on a JointJS+ package.'
        type: boolean
        required: false
        default: false
      demos:
        description: 'Comma-separated demo names to build. Empty means all of them.'
        type: string
        required: false
        default: ''
      jobs:
        description: 'How many demos to build at once.'
        type: number
        required: false
        default: 4
      demos_ref:
        description: 'Branch or tag of the demos to build. Falls back to the default branch when it does not exist here, so it is safe to ask for one unconditionally.'
        type: string
        required: false
        default: ''
    secrets:
      JOINTJS_NPM_TOKEN:
        description: 'Token for https://npm.jointjs.com. Required even when a caller supplies tarballs: those need not cover every @joint/* package the demos use.'
        required: true
  push:
    branches:
      - main
    # A merge that only touches prose cannot break a build, and this builds
    # every demo. `paths-ignore` skips only when *every* changed file matches,
    # so a commit that touches both a demo and its README still runs.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      plus_only:
        description: 'Build only the demos that depend on a JointJS+ package.'
        type: boolean
        required: false
        default: false
      demos:
        description: 'Comma-separated demo names to build. Empty means all of them.'
        type: string
        required: false
        default: ''
      demos_ref:
        description: 'Branch or tag of the demos to build. Empty builds the ref this workflow was started on.'
        type: string
        required: false
        default: ''

# The literal prefix matters. Inside a reusable workflow `github.workflow` is the
# *caller's* workflow name, so without it a run called from elsewhere would land
# in the same group as the caller and cancel the very job waiting on it.
concurrency:
  group: build-demos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Runs before any checkout, which is why it probes the remote rather than
      # a working tree. See the note at the top of this file.
      - name: Resolve which commit of joint-demos to build
        id: resolve
        env:
          REQUESTED: ${{ inputs.demos_ref }}
          # The repository this workflow file lives in, which is this one, even
          # when the run belongs to the caller.
          DEMOS_REPO: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail

          url="https://github.com/$DEMOS_REPO.git"

          if [ -z "$REQUESTED" ]; then
            ref="$WORKFLOW_SHA"
            why="no ref requested"
          else
            # `--heads --tags` is what makes "a branch or a tag" the supported
            # input. `--exit-code` then separates the two answers that matter:
            # 0 the ref is there, 2 it is not. Anything else is a network or
            # permission failure, and quietly building some other branch is
            # worse than stopping. Unauthenticated, as this repo is public.
            set +e
            git ls-remote --exit-code --heads --tags "$url" "$REQUESTED" >/dev/null 2>&1
            found=$?
            set -e

            if [ "$found" -eq 0 ]; then
              ref="$REQUESTED"
              why="requested"
            elif [ "$found" -eq 2 ]; then
              # The default branch, deliberately, and not $WORKFLOW_SHA: a
              # caller may pin `uses:` to a commit so that it controls which
              # version of *this workflow* runs, and that must not also freeze
              # which commit of the demos gets built.
              ref="$(git ls-remote --symref "$url" HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2; exit }')"
              [ -n "$ref" ] || { echo "::error::could not resolve the default branch of $DEMOS_REPO"; exit 1; }
              why="requested '$REQUESTED' does not exist here, using the default branch"
            else
              echo "::error::could not read refs from $url (git ls-remote exited $found)"
              exit 1
            fi
          fi

          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "why=$why" >> "$GITHUB_OUTPUT"
          echo ":: Building $DEMOS_REPO at $ref ($why)"

      # `actions/checkout` defaults to the *calling* repository: inside a
      # reusable workflow the `github` context belongs to the caller, so a bare
      # checkout would fetch the caller. `job.workflow_repository` names this
      # repository whether someone called us or we ran the workflow ourselves.
      - name: Checkout joint-demos
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.resolve.outputs.ref }}
          fetch-depth: 1
          # This job installs and builds every selected demo, which runs npm
          # lifecycle scripts and each demo's own build - third-party code, in
          # other words - and nothing here pushes. Left at its default, checkout
          # would write the token into .git/config where all of that can read
          # it. Worth more than the usual hygiene here: on a `workflow_call` the
          # token belongs to the *caller*, so it is not necessarily scoped to
          # this repository, or to a public one.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Every demo runs its own `npm install`, so without this the runner
      # downloads the same tarballs again on every run. Keyed on the manifests,
      # with a prefix fallback so that touching one demo's dependencies reuses
      # the cache rather than throwing all of it away.
      #
      # This has to come before the linking step below: `hashFiles` is evaluated
      # when the step starts and linking rewrites every demo's package.json, so
      # the other order would change the key on every run and never hit.
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package.json', '**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Download @joint/* tarballs
        if: inputs.packages_artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.packages_artifact }}
          path: .packages

      # --skip-install because the script would otherwise install every demo in
      # the repository, including the ones this run is not going to build.
      - name: Link local packages
        if: inputs.packages_artifact
        run: |
          ls -l .packages
          node .github/scripts/link-local-packages.mjs --skip-install

      - name: Build demos
        id: build
        env:
          DEMOS: ${{ inputs.demos }}
          JOINTJS_NPM_TOKEN: ${{ secrets.JOINTJS_NPM_TOKEN }}
          # The runner has ~14 GB free and no room to keep every demo's
          # node_modules; the script reclaims each one once its output is copied.
          CLEANUP: '1'
        run: |
          set -o pipefail
          args=(--force --jobs "${{ inputs.jobs || 4 }}")
          if [ "${{ inputs.plus_only || false }}" = "true" ]; then
            args+=(--plus-only)
          fi
          if [ -n "$DEMOS" ]; then
            args+=(--demos "$DEMOS")
          fi
          # Kept so the next step can name the failures without re-running
          # anything; the script itself only prints and sets the exit code.
          bash .github/scripts/build-demos.sh "${args[@]}" 2>&1 | tee /tmp/build.log

      # `always()` so a failed build is still summarised, and so the failing
      # demos are visible on the run's summary page without opening the log.
      - name: Summarise
        if: always()
        run: |
          {
            echo '## Demo build results'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| **Demos** | \`${{ steps.resolve.outputs.ref }}\` (${{ steps.resolve.outputs.why }}) |"
            echo "| **Packages** | ${{ inputs.packages_artifact && format('`{0}`', inputs.packages_artifact) || 'as pinned by each demo' }} |"
            echo "| **Selection** | ${{ inputs.plus_only && 'JointJS+ demos' || 'all demos' }}${{ inputs.demos && format(' ({0})', inputs.demos) || '' }} |"
            grep -E '^(Built|Failed|Skipped):' /tmp/build.log 2>/dev/null \
              | sed -E 's/^([^:]+): (.*)$/| **\1** | \2 |/' || true
          } >> "$GITHUB_STEP_SUMMARY"

          failed="$(sed -n 's/^Failed: [0-9]* demos: //p' /tmp/build.log 2>/dev/null || true)"
          if [ -n "$failed" ]; then
            for demo in $failed; do
              echo "::error title=Demo build failed::$demo"
            done
          fi
